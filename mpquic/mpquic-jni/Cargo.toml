[package]
name = "mpquic-jni"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mpquic_jni"
# cdylib for the Android JNI .so; rlib so other frontends (the Linux CLI in
# ../linux) can reuse the engine as a plain Rust library.
crate-type = ["cdylib", "rlib"]

[dependencies]
tquic = { path = "../tquic" }
jni = "0.21"
mio = { version = "0.8", features = ["net", "os-poll"] }
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
slab = "0.4"
# Blocking HTTP client for answer_mode="forward" (relay a tunneled request's
# body verbatim to an external backend). Synchronous, no runtime of its own --
# matches this crate's own non-async, mio-driven design, same rationale as
# tquic-vlm-server-interface's choice of the same crate.
ureq = "2"

[dev-dependencies]
mockito = "1"

[profile.release]
opt-level = 2
strip = true

[workspace]
