[package]
name = "mpquic-jni"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mpquic_jni"
# cdylib for the Android JNI .so; rlib so other frontends (the Linux CLI in
# ../linux) can reuse the engine as a plain Rust library.
crate-type = ["cdylib", "rlib"]

[dependencies]
tquic = { path = "../tquic" }
jni = "0.21"
mio = { version = "0.8", features = ["net", "os-poll"] }
log = { version = "0.4", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
slab = "0.4"

[profile.release]
opt-level = 2
strip = true

[workspace]
